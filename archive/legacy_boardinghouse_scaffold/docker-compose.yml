services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bmsx
      POSTGRES_PASSWORD: bmsx
      POSTGRES_DB: bmsx
    ports:
      - "5432:5432"
    volumes:
      - bmsx_postgres_data:/var/lib/postgresql/data

volumes:
  bmsx_postgres_data:
